name: movie-planner-prod

# Production topology (ADR 0009): one application image run as two process
# roles (`web` and `worker`) backed by PostgreSQL alone. There is no `client`,
# scraper, or scraper-cron service — `web` serves HTTP/SSE and the baked SPA,
# `worker` consumes the scrape_jobs queue and runs the scheduler.
#
# Deployment:
#   cp .env.prod.example .env   # fill in POSTGRES_PASSWORD, JWT_SECRET, ALLOWED_ORIGINS
#   docker compose -f compose.prod.yaml up -d --build
#   ./scripts/smoke-test-prod.sh
#
# The image is built locally (there is no registry publication); both roles
# reference the same `image:` tag so a single `--build` produces the shared
# image. See docs/guides/deployment/production.md.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: movie-planner:${IMAGE_TAG:-prod}

# Shared Postgres connection contract used by every service that talks to db.
# Merged in via `<<: *postgres-env` so the credential triplet is declared once.
x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-movie_planner}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      <<: *postgres-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Baseline schema + reference data for a fresh volume; the postgres image
      # applies it on first start, then web's AUTO_MIGRATE layers numbered
      # migrations on top. NOT exposed to the host — db is internal-only.
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-movie_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      <<: *postgres-env
      NODE_ENV: production
      ROLE: web
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Same-origin SPA: the public origin the browser reaches this service at.
      # Same-origin POST/PUT requests still carry an Origin header, and the auth
      # routes reject origins absent from this list.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      AUTO_MIGRATE: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  worker:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *postgres-env
      NODE_ENV: production
      ROLE: worker
      RUN_MODE: consumer
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENABLE_SCRAPE_CRON: ${ENABLE_SCRAPE_CRON:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9091/metrics', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
