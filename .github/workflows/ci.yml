name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-guard:
    name: Inherited identity / hostname guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run the identity guard
        run: |
          chmod +x .github/scripts/identity-guard.sh
          .github/scripts/identity-guard.sh

  unit-and-coverage:
    name: TypeScript build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: movie_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movie_planner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build scraper-protocol workspace
        run: npm run build --workspace=@movie-planner/scraper-protocol

      - name: TypeScript type-check (server)
        run: npx tsc --noEmit
        working-directory: server

      - name: TypeScript type-check (client)
        run: npx tsc -b
        working-directory: client

      - name: TypeScript type-check (scraper)
        run: npx tsc --noEmit
        working-directory: scraper

      - name: Run tests
        run: npm run test:run
        env:
          PG_QUEUE_TEST_URL: postgres://postgres:test@localhost:5432/movie_planner_test
        working-directory: server

      - name: Check test coverage
        run: npm run test:coverage
        env:
          PG_QUEUE_TEST_URL: postgres://postgres:test@localhost:5432/movie_planner_test
        working-directory: server

      - name: Run scraper tests (incl. Postgres queue/LISTEN-NOTIFY integration)
        run: npm run test:run
        env:
          PG_QUEUE_TEST_URL: postgres://postgres:test@localhost:5432/movie_planner_test
        working-directory: scraper

      - name: Scraper-protocol tests & coverage
        run: npm run test:coverage --workspace=@movie-planner/scraper-protocol
